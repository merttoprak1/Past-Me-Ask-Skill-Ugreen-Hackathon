<!doctype html>
<html><head><meta charset="utf-8"><title>Past Me Asks story</title>
<style>
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#141217}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Avenir Next','Avenir','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage div{box-sizing:border-box}
.sp{display:inline-block}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;mix-blend-mode:overlay;opacity:.09}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0}
</style>
<script src="timeline.js"></script>
</head><body><div id="stage"></div>
<script>
window.onerror=(m,s,l,c,e)=>{window.__err=String(m)+' @'+l+':'+c;};
const W=1920,H=1080;
const C={ink:'#141217',ink2:'#211E25',paper:'#F4EEE3',white:'#FFFCF6',amber:'#FF8A1F',blue:'#2E46FF',lime:'#D8FF4D',coral:'#FF5A4E',violet:'#8C7BFF',teal:'#12B99A',grey:'#6E675F',rec:'#FF4B3E'};
const SANS="'Avenir Next','Avenir','Helvetica Neue',sans-serif";
const SERIF="'Iowan Old Style','Hoefler Text',Georgia,serif";
const MONO="Menlo,'Courier New',monospace";
const stage=document.getElementById('stage');
const TL=window.TL;

const E={lin:x=>x,o3:x=>1-Math.pow(1-x,3),i3:x=>x*x*x,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 oexpo:x=>x>=1?1:1-Math.pow(2,-10*x),oback:x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}};
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,d,e='oexpo')=>E[e](cl((t-a)/d));
function mk(parent,html,css={}){const d=document.createElement('div');d.innerHTML=html;d.style.position='absolute';for(const k in css)d.style[k]=css[k];parent.appendChild(d);return d;}
function T(el,{x=0,y=0,s=1,r=0,op=1,b=0,br=1}={}){
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  el.style.opacity=cl(op).toFixed(3);
  let f='';if(b>0.05)f+=`blur(${b.toFixed(2)}px) `;if(br!==1)f+=`brightness(${br.toFixed(3)})`;el.style.filter=f||'none';
}
function rv(el,t,a,o={}){
  const {d=.55,dy=70,dx=0,s0=1,r0=0,b0=6,e='oexpo',z=null,dz=.3,zy=-50,zx=0}=o;
  const p=P(t,a,d,e),q=z==null?0:P(t,z,dz,'i3');
  T(el,{x:dx*(1-p)+zx*q,y:dy*(1-p)+zy*q,s:s0+(1-s0)*p,r:r0*(1-p),op:(t<a?0:cl(p*1.4))*(1-q),b:b0*(1-cl(p))+10*q});
}
function words(parent,text,gap='0.24em'){const arr=text.split(' ');return arr.map((w,i)=>{const s=document.createElement('span');s.className='sp';s.innerHTML=w;if(i<arr.length-1)s.style.marginRight=gap;parent.appendChild(s);return s;});}
function line(parent,text,css){const d=mk(parent,'',Object.assign({left:'0px',width:W+'px',textAlign:'center',whiteSpace:'nowrap'},css));d.w=words(d,text);return d;}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
const scenes=[];
function scene(id,bg,build){
  const S=TL.scenes[id];if(!S)throw new Error('no scene '+id);
  const root=mk(stage,'',{left:'0px',top:'0px',width:W+'px',height:H+'px',background:bg,display:'none',overflow:'hidden'});
  const c=n=>{const v=TL.cues[id+'.'+n];if(v==null)throw new Error('missing cue '+id+'.'+n);return v-S.start;};
  const w=n=>{const v=TL.words[id+'.'+n];if(!v)throw new Error('missing words '+id+'.'+n);return v.map(x=>x-S.start);};
  const end=(id==='outro')?TL.duration+5:S.end;
  scenes.push({a:S.start,b:end,root,r:build(root,c,w,S.end-S.start)});
}
// reveal words of a synced line at the times they are spoken
function sayWords(ws,lt,times,o={}){ws.forEach((el,i)=>rv(el,lt,times[Math.min(i,times.length-1)]-0.06,o));}
function makeLogo(root,top,size){
  const logo=mk(root,'',{left:'0px',width:W+'px',top:top+'px',textAlign:'center',whiteSpace:'nowrap',font:`800 ${size}px ${SANS}`,letterSpacing:'-0.055em',color:C.paper});
  const L=[];'past me asks'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.className='sp';s.innerHTML=ch===' '?'&nbsp;':ch;if(i>=8)s.style.color=C.amber;logo.appendChild(s);L.push(s);});
  const dot=document.createElement('span');dot.className='sp';Object.assign(dot.style,{width:size*.17+'px',height:size*.17+'px',borderRadius:'50%',background:C.rec,marginLeft:size*.1+'px',verticalAlign:'top',marginTop:size*.2+'px'});logo.appendChild(dot);
  logo.L=L;logo.dot=dot;return logo;
}
function chipHTML(txt,col,size=24){return `<span style="background:${col};color:${C.ink};font:700 ${size}px ${MONO};letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;border-radius:999px;white-space:nowrap">${txt}</span>`;}
const pulse=(lt,a,amp=.12,d=.35)=>1+amp*Math.sin(Math.PI*cl((lt-a)/d));

/* Story cut of the Past Me Asks video. Every quote, date, file name, number and person comes from
   this repo: references/report-format.md (one made-up person's memos and the saved dialogue),
   references/use-cases.md (Ana, Jonas, Sofia, Priya), SKILL.md and proposal.pdf. */

function wrapWords(parent,text,css){const d=mk(parent,'',Object.assign({whiteSpace:'normal'},css));d.w=words(d,text);return d;}
function waveBars(parent,N,bw,gap,cy,maxH,seed,color){const R=rng(seed),total=N*(bw+gap)-gap,x0=(W-total)/2,bars=[];
  for(let i=0;i<N;i++){const env=Math.pow(Math.sin(Math.PI*(i+.5)/N),.5);const h=20+(0.25+0.75*R())*env*maxH;bars.push(mk(parent,'',{left:(x0+i*(bw+gap))+'px',top:(cy-h/2)+'px',width:bw+'px',height:h+'px',borderRadius:(bw/2)+'px',background:color}));}
  return bars;}
const QCARD={left:'310px',top:'300px',width:'1300px',padding:'54px 64px 60px',background:C.white,borderRadius:'34px',boxShadow:'0 40px 90px rgba(60,35,10,.20), 0 2px 0 rgba(0,0,0,.04)'};
function quoteCardHTML(type,col,meta,quote,size=82){return `<div style="display:flex;gap:24px;align-items:center;margin-bottom:30px">${chipHTML(type,col)}<span style="font:500 27px ${MONO};color:${C.grey}">${meta}</span></div><div style="font:italic 500 ${size}px ${SERIF};line-height:1.1;color:${C.ink}">“${quote}”</div>`;}

/* ───────── 2019: a memo to the future ───────── */
scene('rec',C.ink,(root,c,w,dur)=>{
  const stamp=mk(root,'14 March 2019 · 08:02',{left:'0px',width:W+'px',top:'150px',textAlign:'center',font:`600 44px ${SANS}`,color:'rgba(244,238,227,.85)',letterSpacing:'.01em'});
  const wf=mk(root,'',{left:'0px',top:'0px',width:W+'px',height:H+'px',transformOrigin:'960px 470px'});
  const bars=waveBars(wf,70,12,9,470,230,11,C.paper);
  const fn=mk(wf,`<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:${C.rec};margin-right:16px;vertical-align:2px"></span>2019-03-14 08-02.m4a`,{left:'0px',width:W+'px',top:'620px',textAlign:'center',font:`500 30px ${MONO}`,color:C.paper});
  const recdot=fn.querySelector('span');
  const clk=mk(wf,'0:00',{left:'0px',width:W+'px',top:'670px',textAlign:'center',font:`500 28px ${MONO}`,color:C.amber});
  const q=line(root,'“Future me, are you still playing guitar?”',{top:'590px',font:`italic 500 92px ${SERIF}`,color:C.paper});
  const meta=mk(root,'question to future self · voice memo · at 1:10',{left:'0px',width:W+'px',top:'730px',textAlign:'center',font:`500 28px ${MONO}`,color:C.amber});
  const td=c('date'),tq=c('quote'),Q=w('q'),te=c('E2');
  return lt=>{
    rv(stamp,lt,td-.1,{dy:30});
    const play=cl(lt/(dur-.3)),secs=lt<tq?70*cl(lt/tq):70+(lt-tq);
    bars.forEach((b,i)=>{const p=P(lt,0.012*i,.5,'oback');const lit=(i+.5)/70<play;b.style.transform=`scaleY(${Math.max(0,p).toFixed(3)})`;b.style.background=lit?C.amber:C.paper;b.style.opacity=lit?1:.3;});
    const s=Math.floor(secs);clk.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    recdot.style.opacity=(Math.floor(lt*2)%2===0)?1:.25;
    const up=P(lt,tq-.6,.8,'io3');wf.style.transform=`translateY(${(-150*up).toFixed(1)}px) scale(${(1-.3*up).toFixed(3)})`;wf.style.opacity=(1-.35*up).toFixed(3);
    stamp.style.transform+=` translateY(${(-40*up).toFixed(1)}px)`;
    sayWords(q.w,lt,Q,{dy:50,b0:8});rv(meta,lt,te,{dy:20});
  };
});

/* ───────── the years: more messages for later ───────── */
scene('years',C.paper,(root,c)=>{
  const lab=mk(root,'messages for later',{left:'0px',width:W+'px',textAlign:'center',top:'56px',font:`600 30px ${MONO}`,color:C.grey,letterSpacing:'.04em'});
  const X=y=>200+(y-2019)*380;
  const axis=mk(root,'',{left:'200px',top:'900px',width:'1520px',height:'4px',background:'#CFC6B6',borderRadius:'2px',transformOrigin:'0 50%'});
  const ticks=[2019,2020,2021,2022,2023].map(y=>mk(root,String(y),{left:(X(y)-60)+'px',width:'120px',textAlign:'center',top:'935px',font:`600 28px ${MONO}`,color:C.grey}));
  const D=[[2019,'question to future self',C.teal,'2019-03-14 · voice memo · at 1:10','Future me, are you still playing guitar?'],
    [2021,'prediction',C.amber,'2021-06-02 · voice memo · at 0:41','In two years I will have my own studio.'],
    [2022,'promise',C.coral,'2022-01-01 · note · New Year 2022.md','I promise I will call Dad every Sunday.'],
    [2023,'worry',C.violet,'2023-09-14 · voice memo · at 2:05','I am scared this job will swallow me.']];
  const dots=D.map(d=>mk(root,'',{left:(X(d[0])-15)+'px',top:'887px',width:'30px',height:'30px',borderRadius:'50%',background:d[2],border:`4px solid ${C.paper}`}));
  const cards=D.map(d=>mk(root,quoteCardHTML(d[1],d[2],d[3],d[4],76),Object.assign({},QCARD,{top:'330px'})));
  const A=[c('intro')+.4,c('m0'),c('m1'),c('m2')],RO=[1.6,-2.2,1.5,-1.2],XO=[20,-26,18,-12];
  return lt=>{
    rv(lab,lt,c('intro'),{dy:20});
    axis.style.transform=`scaleX(${P(lt,c('intro'),1.2,'io3').toFixed(3)})`;
    ticks.forEach((t,i)=>rv(t,lt,c('intro')+.2+i*.15,{dy:15,b0:0}));
    dots.forEach((d,i)=>{const p=P(lt,A[i],.5,'oback');T(d,{s:Math.max(0,p),op:lt<A[i]?0:1});});
    cards.forEach((cd,i)=>{
      if(lt<A[i]){cd.style.opacity=0;return;}
      const p=P(lt,A[i],.55,'oback');let k=0;for(let j=i+1;j<4;j++)k+=P(lt,A[j],.5,'o3');
      T(cd,{x:XO[i],y:760*(1-p)-60*k,s:1-.05*k,r:RO[i]+12*(1-p),op:1,br:1-.07*k});cd.style.zIndex=String(10+i);
    });
  };
});

/* ───────── then life happens ───────── */
scene('forgot',C.ink,(root,c,w,dur)=>{
  const R=rng(5),p2=n=>String(n).padStart(2,'0');let html='';
  for(let k=0;k<5;k++){let col='';for(let r=0;r<70;r++){const y=2019+Math.floor(R()*8),m=1+Math.floor(R()*12),d=1+Math.floor(R()*28),hh=7+Math.floor(R()*15),mm=Math.floor(R()*60),q=R();
    col+=(q<.72?`${y}-${p2(m)}-${p2(d)} ${p2(hh)}-${p2(mm)}.m4a`:`Journal ${y}-${p2(m)}-${p2(d)}.md`)+'<br>';}
    html+=`<div style="position:absolute;left:${60+k*380}px;top:0">${col}</div>`;}
  const bgw=mk(root,html,{left:'0px',top:'0px',width:W+'px',height:'3200px',font:`500 24px ${MONO}`,lineHeight:'44px',color:C.paper,opacity:'0'});
  const zoomer=mk(root,'',{left:'0px',top:'0px',width:W+'px',height:H+'px'});
  const life=line(zoomer,'then life happens.',{top:'450px',font:`800 120px ${SANS}`,color:C.paper,letterSpacing:'-0.045em'});
  const cnt=mk(zoomer,'',{left:'0px',width:W+'px',top:'300px',display:'flex',justifyContent:'center',gap:'160px'});
  const grp=(col)=>{const g=document.createElement('div');g.className='sp';g.style.textAlign='center';g.innerHTML=`<div style="font:800 210px ${SANS};letter-spacing:-0.05em;color:${col};line-height:1">0</div><div style="font:600 56px ${SANS};color:${C.paper};margin-top:10px"></div>`;cnt.appendChild(g);return g;};
  const gM=grp(C.amber),gN=grp(C.paper);gM.lastChild.textContent='memos';gN.lastChild.textContent='notes';
  const a=line(zoomer,'nobody goes back to listen.',{top:'450px',font:`800 120px ${SANS}`,color:C.paper,letterSpacing:'-0.045em'});
  const b1=line(zoomer,'you can’t search for a promise',{top:'370px',font:`800 92px ${SANS}`,color:C.paper,letterSpacing:'-0.035em'});
  const b2=line(zoomer,'you no longer remember making.',{top:'500px',font:`800 104px ${SANS}`,color:C.amber,letterSpacing:'-0.045em'});
  const tl=c('life'),tc=c('count'),t212=c('n212'),t52=c('n52'),A=w('a'),B1=w('b1'),B2=w('b2'),tb=c('b');
  return lt=>{
    bgw.style.opacity=(0.11*P(lt,tc,1.2,'o3')).toFixed(3);bgw.style.transform=`translateY(${(-60-lt*70).toFixed(1)}px)`;
    life.w.forEach((x,i)=>rv(x,lt,tl+i*.18,{dy:60,z:tc-.25,dz:.25}));
    rv(cnt,lt,tc,{dy:40,z:A[0]-.35,dz:.3});
    gM.firstChild.textContent=String(Math.round(212*E.o3(cl((lt-tc)/Math.max(.5,t212-tc)))));
    gN.firstChild.textContent=String(Math.round(52*E.o3(cl((lt-t212)/Math.max(.5,t52-t212)))));
    sayWords(a.w,lt,A,{z:tb-.25,dz:.25});
    sayWords(b1.w,lt,B1,{dy:60});sayWords(b2.w,lt,B2,{dy:80});
    zoomer.style.transform=`scale(${(1+.08*P(lt,dur-.8,.8,'i3')).toFixed(4)})`;
  };
});

/* ───────── the turn + title ───────── */
scene('turn',C.amber,(root,c,w)=>{
  const s1=line(root,'most archive tools let you',{top:'240px',font:`700 64px ${SANS}`,color:C.ink,letterSpacing:'-0.02em'});
  const s2=line(root,'ask your past.',{top:'320px',font:`800 172px ${SANS}`,color:C.ink,letterSpacing:'-0.05em'});
  const t1=line(root,'this one lets',{top:'240px',font:`700 64px ${SANS}`,color:C.paper,letterSpacing:'-0.02em'});
  const t2=line(root,'your past ask you.',{top:'320px',font:`800 172px ${SANS}`,color:C.amber,letterSpacing:'-0.05em'});
  const pill=(txt,wd)=>{const p=mk(root,txt,{top:'640px',left:'0px',width:wd+'px',height:'100px',lineHeight:'100px',textAlign:'center',borderRadius:'999px',font:`800 54px ${SANS}`,letterSpacing:'-0.02em'});p._w=wd;return p;};
  const pYou=pill('you',230),pPast=pill('past me',350);
  const arrow=mk(root,'<div style="position:absolute;left:0;top:0;height:8px;width:100%;background:currentColor;border-radius:4px"></div><div style="position:absolute;right:-10px;top:-16px;width:0;height:0;border-left:34px solid currentColor;border-top:20px solid transparent;border-bottom:20px solid transparent"></div>',{top:'686px',left:'790px',width:'330px',height:'8px',transformOrigin:'0 50%'});
  const logo=makeLogo(root,330,240);
  const sub=line(root,'a skill for the UGREEN AI NAS',{top:'660px',font:`500 34px ${MONO}`,color:'rgba(244,238,227,.75)'});
  const LX=600,RX=1320,B=c('phaseB'),Lg=c('logo'),S1=w('s1'),S2=w('s2'),T1=w('t1'),T2=w('t2'),PY=c('pyou'),AR=c('arrow'),PP=c('ppast'),SB=c('sub');
  return lt=>{
    const A_=lt<B,C_=lt>=Lg;
    root.style.background=A_?C.amber:C.ink;
    s1.style.display=s2.style.display=A_?'block':'none';
    t1.style.display=t2.style.display=(!A_&&!C_)?'block':'none';
    pYou.style.display=pPast.style.display=arrow.style.display=C_?'none':'block';
    logo.style.display=sub.style.display=C_?'block':'none';
    if(A_){
      sayWords(s1.w,lt,S1,{dy:40});sayWords(s2.w,lt,S2,{dy:110});
      Object.assign(pYou.style,{background:C.ink,color:C.paper});Object.assign(pPast.style,{background:C.paper,color:C.ink});arrow.style.color=C.ink;
      const a=P(lt,PY,.45,'oback'),b=P(lt,PP,.45,'oback');
      T(pYou,{x:LX-pYou._w/2,s:Math.max(0,a),op:lt<PY?0:1});T(pPast,{x:RX-pPast._w/2,s:Math.max(0,b),op:lt<PP?0:1});
      arrow.style.transform=`scaleX(${P(lt,AR,.45,'o3').toFixed(3)})`;arrow.style.opacity=lt<AR?0:1;
    } else if(!C_){
      sayWords(t1.w,lt,T1,{dy:40});sayWords(t2.w,lt,T2,{dy:110});
      Object.assign(pYou.style,{background:C.paper,color:C.ink});Object.assign(pPast.style,{background:C.amber,color:C.ink});arrow.style.color=C.paper;
      const k=P(lt,B,.8,'io3'),arc=Math.sin(Math.PI*k);
      T(pYou,{x:LX+(RX-LX)*k-pYou._w/2,y:70*arc});T(pPast,{x:RX-(RX-LX)*k-pPast._w/2,y:-70*arc});
      arrow.style.transform='scaleX(1)';arrow.style.opacity=1;
    } else {
      logo.L.forEach((s,i)=>rv(s,lt,Lg+i*.035,{dy:140,e:'oback',d:.6,b0:0}));
      logo.dot.style.transform=`scale(${(P(lt,Lg+.55,.4,'oback')*(1+.12*Math.sin((lt-Lg)*Math.PI*4))).toFixed(3)})`;
      sub.w.forEach((s,i)=>rv(s,lt,SB+i*.05,{dy:30,b0:0}));
    }
  };
});

/* ───────── today: past you gets to ask ───────── */
scene('today',C.paper,(root,c,w)=>{
  const stamp=mk(root,'today · 2026-11-20',{left:'160px',top:'70px',font:`600 30px ${MONO}`,color:C.grey,letterSpacing:'.04em'});
  const head=mk(root,'past you left 4 messages for the future:',{left:'160px',top:'140px',font:`700 58px ${SANS}`,color:C.ink,letterSpacing:'-0.02em',whiteSpace:'nowrap'});
  const R=[['prediction',C.amber,'2021-06-02','In two years I will have my own studio.'],['promise',C.coral,'2022-01-01','I promise I will call Dad every Sunday.'],['worry',C.violet,'2023-09-14','I am scared this job will swallow me.'],['question to future self',C.teal,'2019-03-14','Future me, are you still playing guitar?']];
  const rows=R.map((r,i)=>mk(root,`<span style="display:inline-block;width:430px">${chipHTML(r[0],r[1])}</span><span style="display:inline-block;width:230px;font:500 28px ${MONO};color:${C.grey}">${r[2]}</span><span style="font:italic 500 46px ${SERIF};color:${C.ink}">“${r[3]}”</span>`,{left:'160px',top:(270+i*118)+'px',whiteSpace:'nowrap'}));
  const card=mk(root,quoteCardHTML('prediction',C.amber,'2021-06-02 10-15.m4a · at 0:41 · date from file name','In two years I will have my own studio.',80)+`<div style="margin-top:26px;font:600 30px ${MONO};color:${C.ink}">Time named: two years, so June 2023.</div>`,Object.assign({},QCARD,{left:'260px',width:'1400px',top:'200px'}));
  const qlab=mk(root,'QUESTION FOR TODAY',{left:'0px',width:W+'px',textAlign:'center',top:'640px',font:`700 30px ${MONO}`,color:C.amber,letterSpacing:'.08em'});
  const q=wrapWords(root,'In 2021 you expected your own studio by 2023. What happened?',{left:'210px',width:'1500px',top:'700px',textAlign:'center',font:`800 76px ${SANS}`,color:C.ink,letterSpacing:'-0.03em',lineHeight:'1.12'});
  const tf=c('find'),tx=c('exact'),ta=c('asks'),Q=w('q');
  return lt=>{
    rv(stamp,lt,0,{dy:20,z:ta,dz:.4});
    rv(head,lt,tf,{dy:40,z:tx-.4,dz:.35});rows.forEach((r,i)=>rv(r,lt,tf+.7+i*.45,{dx:60,dy:0,z:tx-.4+i*.04,dz:.35}));
    const up=P(lt,ta,.7,'io3');
    if(lt>=tx){rv(card,lt,tx,{dy:90,s0:.92});card.style.transform+=` translateY(${(-120*up).toFixed(1)}px)`;}else card.style.opacity=0;
    rv(qlab,lt,ta+.2,{dy:20});
    sayWords(q.w,lt,Q,{dy:50});
  };
});

/* ───────── the answer ───────── */
scene('answer',C.paper,(root,c,w)=>{
  const qb=mk(root,`<div style="font:600 26px ${MONO};color:${C.grey};margin-bottom:16px;letter-spacing:.04em">QUESTION FOR TODAY</div><div style="font:700 56px ${SANS};line-height:1.15;color:${C.ink};letter-spacing:-0.015em">In 2021 you expected your own studio by 2023. What happened?</div>`,{left:'210px',top:'110px',width:'1300px',padding:'44px 52px',background:C.white,borderRadius:'32px 32px 32px 10px',boxShadow:'0 30px 80px rgba(60,35,10,.14)'});
  const opts=mk(root,'',{left:'0px',width:W+'px',top:'470px',display:'flex',justifyContent:'center',gap:'28px'});

const flash=mk(stage,'',{});flash.className='ov';flash.style.background='#FFF6E8';
const fade=mk(stage,'',{});fade.className='ov';fade.style.background='#000';
const gc=document.createElement('canvas');gc.width=960;gc.height=540;gc.id='grain';stage.appendChild(gc);
const gx=gc.getContext('2d'),gimg=gx.createImageData(960,540);
function grain(seed){const R=rng(seed*7919+13),d=gimg.data;for(let i=0;i<d.length;i+=4){const v=(R()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gx.putImageData(gimg,0,0);}
const LOGO=TL.cues['turn.logo'],END=TL.duration;
window.renderFrame=function(t){
  for(const s of scenes){const on=t>=s.a&&t<s.b;s.root.style.display=on?'block':'none';if(on)s.r(t-s.a,t);}
  let f=0;if(t>=LOGO-.3&&t<LOGO)f=.85*(t-LOGO+.3)/.3;else if(t>=LOGO&&t<LOGO+.5)f=.85*(1-(t-LOGO)/.5);

  grain(Math.floor(t*12)+1);
};
document.fonts.ready.then(()=>{try{window.renderFrame(0);window.__ready=true;}catch(e){window.__err=String(e);}});
